spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: file://${java.io.tmpdir}/config-repo
          clone-on-start: true
          default-label: main

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,configprops
  endpoint:
    health:
      show-details: always
