spring:
  application:
    name: identity-service
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_wallet_identity
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
  
  redis:
    host: localhost
    port: 6379
    database: 1
    timeout: 60000
    jedis:
      pool:
        max-active: 50
        max-idle: 25
        min-idle: 10

server:
  port: 8081
  servlet:
    context-path: /

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:my-super-secret-key-for-production-use-very-long-string-here-at-least-32-characters}
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# Logging
logging:
  level:
    root: INFO
    com.aiwalletplatform: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/identity-service.log
    max-size: 100MB
    max-history: 30

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,env,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# OpenAPI / Swagger Documentation
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /api-docs
  show-actuator: true

# Application Info
info:
  app:
    name: Identity Service
    description: OAuth2, JWT, and RBAC Management
    version: 1.0.0
