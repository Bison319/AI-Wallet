spring:
  application:
    name: fraud-detection-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_wallet_fraud
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-test-key}
      model: gpt-4
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
