spring:
  application:
    name: ai-assistant-service
  
  # Spring AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-your-api-key-here}
      chat:
        model: gpt-4
        options:
          temperature: 0.7
          max-tokens: 1000
          top-p: 0.9
      embedding:
        model: text-embedding-3-small
      base-url: https://api.openai.com/v1
    retry:
      max-attempts: 3
      backoff:
        initial-delay: 100ms
        multiplier: 2.0
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
  
  # Database
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_wallet_assistant
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  
  # Redis for conversation memory
  redis:
    host: localhost
    port: 6379
    database: 2
    timeout: 60000
    jedis:
      pool:
        max-active: 50
        max-idle: 25
        min-idle: 10

# Kafka Configuration
kafka:
  bootstrap-servers: localhost:9092
  producer:
    acks: all
    retries: 3
    batch-size: 16384
    linger-ms: 10
  consumer:
    group-id: ai-assistant-consumer-group
    auto-offset-reset: earliest
    max-poll-records: 500

server:
  port: 8089
  servlet:
    context-path: /

# Logging
logging:
  level:
    root: INFO
    com.aiwalletplatform: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ai-assistant-service.log
    max-size: 100MB
    max-history: 30

# Actuator & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,env,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ai-assistant-service

# OpenAPI / Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /api-docs

# AI Configuration
ai-config:
  assistant:
    model-type: openai
    context-window-size: 10
    max-conversation-length: 20
    conversation-ttl-hours: 24
    enable-memory: true
    enable-streaming: true
  models:
    gpt-4:
      enabled: true
      max-tokens: 1000
      temperature: 0.7
    gpt-3.5-turbo:
      enabled: true
      max-tokens: 500
      temperature: 0.8

# Application Info
info:
  app:
    name: AI Assistant Service
    description: Spring AI powered financial assistant with conversational abilities
    version: 1.0.0
